name: deploy-backend
on:
    workflow_dispatch:

    push:
        branches: 
        - "release/*"
        # paths:
        #     - "backend/**"
        #     - '.github/workflows/backend.yaml'
        #     - 'infra/*'
env:
    artifact_dir: .artifacts
jobs:
  deploy-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_HF_TOKEN             : ${{secrets.TF_VAR_HF_TOKEN}}
      TF_VAR_MYSQL_PASSWORD       : ${{secrets.TF_VAR_MYSQL_PASSWORD }}
      TF_VAR_MYSQL_ROOT_PASSWORD  : ${{secrets.TF_VAR_MYSQL_ROOT_PASSWORD}}
    steps:
        - name: checkout-repo
          uses: actions/checkout@v5

        - name: auth-aws
          uses: aws-actions/configure-aws-credentials@main
          with:
            aws-region: "eu-central-1"
            aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
            aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

        - name: setup-terraform
          uses: hashicorp/setup-terraform@v3

        - name: init-terraform
          run: |
            echo "current working dir: ${PWD}"
            terraform init
            terraform validate

        - name: deploy-db
          id: db
          continue-on-error: false
          run: terraform apply -target=module.aurora --auto-approve
