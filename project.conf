# Database Configuration
MYSQL_HOST=db               # name of the docker compose database service
MYSQL_PORT=3306
MYSQL_USER=admin
MYSQL_DATABASE=tts_dataset_generator
MYSQL_PASSWORD_FILE=/run/secrets/db_password
MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password

# Application Configuration
STORAGE_PATH="recordings"

# Export Timeouts (in seconds)
HF_EXPORT_TIMEOUT=300
S3_EXPORT_TIMEOUT=300

# AWS Configuration (for S3 export)
AWS_DEFAULT_REGION=eu-central-1
AWS_ACCESS_KEY_ID_FILE=/run/secrets/aws_access_id
AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/aws_access_secret

# Hugging Face Configuration (for HF export)
HUGGINGFACE_REPO=your-hf-data-repo
HUGGINGFACE_TOKEN_FILE=/run/secrets/hf_token

#app env vars
APP_PORT=8500
# Backend url with respect to a unified container for both front & backend services
VITE_BACKEND_URL=http://localhost:${APP_PORT}

CORS_REGEX="^https?://(localhost:\d{2,4}|[\w.-]+\.cloudfront\.net)$"

# JWT Configuration
JWT_SECRET_KEY=your-super-secret-jwt-key-change-this-in-production-9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
JWT_ALGORITHM=HS256
JWT_EXPIRE_MINUTES=1440

# SES Email (for password reset)
SES_SENDER_EMAIL=noreply@yourdomain.com
FRONTEND_URL=http://localhost:${APP_PORT}

# GeoNames API (for city lookup)
VITE_BACKEND_URL=http://localhost:8500